services:
  db:
    image: postgres:16
    container_name: bip_db
    environment:
      POSTGRES_USER: bip
      POSTGRES_PASSWORD: bip
      POSTGRES_DB: bip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bip -d bip"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: bip_api
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build: ./frontend
    container_name: bip_web
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
