# Runs database, backend, and frontend services together
services:
  db:
    image: postgres:16
    container_name: bip_db
    environment:
      POSTGRES_USER: bip
      POSTGRES_PASSWORD: bip
      POSTGRES_DB: bip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bip -d bip"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: bip_backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: bip
      DB_PASS: bip
      DB_NAME: bip
      DB_PORT: 5432
      PORT: 3000
    ports:
      - "3000:3000"
    command: node dist/backend.js

  web:
    build: ./frontend
    container_name: bip_web
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
